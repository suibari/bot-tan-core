# bot 機（Raspberry Pi）で動かす、検索と Wikipedia の共通出口（gateway）。
#
# 【SearXNG はやめた（2026-11-19）】
#   自宅回線から Yahoo をスクレイピングし続けた結果、IPv4 が汚染され（11月上旬。偽の結果や
#   HTTP 500 が返る）、11/08 に IPv6 へ移したあとも 11/14 には /64 ごと同じ状態になった。
#   いまは Web 検索 API の毎月の無料枠で引く（Tavily → Exa lite の順）。比較は
#   docs/evaluations/search-api/。ディレクトリ名 searxng/ と、bot 側の SEARXNG_* という
#   環境変数名は互換のため残している。
#
# 【無料枠を超えないために】
#   gateway が API ごとの1日の上限を持ち、使った回数を ./data/budget.json に残す（再起動しても
#   その日の残りは増えない）。上限は月の無料枠÷31（Tavily 1,000回 → 32回、Exa $10 → 80回）。
#   使い切ったら翌0時（JST）まで /search は 429 を返す（Wikipedia API は止めない）。
#   その日の使用量: curl -s -H "Authorization: Bearer $KEY" localhost:8080/stats | jq .budget
#
# 起動:
#   cd searxng
#   cp .env.example .env && $EDITOR .env   # API キーを埋める
#   docker compose up -d
#
# gateway.py は bind mount なので、書き換えたら --force-recreate が要る。
services:
  gateway:
    image: docker.io/library/python:3.13-alpine
    container_name: nagi-search-gateway
    restart: unless-stopped
    command: ["python", "-B", "/app/gateway.py"]
    # ./data に書けるよう、リポジトリの持ち主の UID で動かす（scripts/deploy-searxng.sh が渡す）。
    user: "${GATEWAY_UID:-1000}:${GATEWAY_GID:-1000}"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    ports:
      - "${SEARCH_GATEWAY_BIND:-127.0.0.1}:${SEARXNG_PORT:-8080}:8080"
    volumes:
      - ./gateway.py:/app/gateway.py:ro
      - ./data:/data
    environment:
      SEARCH_GATEWAY_API_KEY: ${SEARCH_GATEWAY_API_KEY:?set SEARCH_GATEWAY_API_KEY in searxng/.env}
      WEB_SEARCH_PROVIDERS: ${WEB_SEARCH_PROVIDERS:-tavily,exa}
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
      EXA_API_KEY: ${EXA_API_KEY:-}
      TAVILY_DAILY_LIMIT: ${TAVILY_DAILY_LIMIT:-32}
      EXA_DAILY_LIMIT: ${EXA_DAILY_LIMIT:-80}
      SEARCH_BUDGET_FILE: /data/budget.json
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=3).close()"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
