# SearXNG 設定。既定値を土台にして、必要な差分だけを書く。
#
# 使うエンジンを絞る（use_default_settings をオブジェクト形式で書くと既定継承 +
# エンジン絞り込みを同時に指定できる。`use_default_settings: true` と併記すると
# YAML のキー重複になるので書かないこと）。
#
# - google は自前インスタンスからだと CAPTCHA / ブロックを食らいやすいので入れない。
# - wikipedia / wikidata は infobox の供給源。固有名詞の実在確認に効くので必須。
#   （この2つは results を返さず infobox だけを返す。0件に見えても働いている）
# - yahoo が一覧・時事・曲名の主索引。bing は yahoo が薄いときの補完（下の weight）。
# engines= と categories=general を併記するとカテゴリ内の全エンジンが追加される。
# gateway がこの併記を解消するので、engines= による送信先の限定が実際に効く。
#
# 日本語で使えるものを実測した結果（2026-09-02）:
#   bing      ✅ 一覧・時事とも十分
#   wikipedia ✅ infobox のみ返す（results は 0 件。実在確認の核心）
#   wikidata  ✅ 同上
#   duckduckgo ❌ 全クエリに CAPTCHA (jp-jp)
#   brave      ❌ 応答なし（ブロック）
#   startpage  ❌ 応答なし（ブロック）
#   qwant      ❌ 応答なし
#   mojeek     △ 応答するが日本語の結果は 0 件（索引が実質空）
#
# 2026-09-27: Bingは曲名を無視/無関係なHTMLを返す不具合を再現。
# 最新版でも再現した。件数だけで正常判定しない。詳細は docs/search-egress.md。
#
# 2026-10-07 の再実測（2026.10.4-d48c4b555、本番回線）:
#   yahoo      ✅ 曲名・一覧・固有名詞の6クエリ全てで関連結果（7件）
#   bing       △ 6クエリ中2つで無関係な結果（ROOKiEZ→大学の質問、技術書典→韓ドラ）
#   duckduckgo △ 一部クエリで CAPTCHA（上流 #6779）
#   brave      ❌ 1回目から too many requests（上流 #6819。IPでなく brave.py の
#                 Accept-Encoding と curl_cffi の組み合わせが原因との分析あり）
#   google     ❌ access denied
#   qwant      ❌ 全クエリ CAPTCHA
# Yahoo の結果も Bing の索引由来だが、取得と解析の経路が別なので Bing の
# 無関係応答を今回は踏まなかった。索引の多様化ではなく、取得経路の冗長化として扱う。
# 代替を試すときは keep_only に足して `docker compose up -d --force-recreate`。
#
# エンジンを増やすほど 1 リクエストの所要時間が伸びる。増やす前に
# `pnpm searxng:probe` でレイテンシを測ること。
use_default_settings:
  engines:
    keep_only:
      - bing
      - wikipedia
      - wikidata
      - yahoo

general:
  instance_name: "nagi-searxng"
  # 自分専用インスタンスなので、公開インスタンス向けの導線は要らない。
  donation_url: false
  contact_url: false
  enable_metrics: true

server:
  # secret_key は compose の SEARXNG_SECRET 環境変数で上書きされる。
  # ここに実値を書かないこと。
  secret_key: "override-me-via-SEARXNG_SECRET"
  # limiter は bot 判定でプログラムからの呼び出しを弾く。LAN 内の自前クライアント
  # からしか叩かないので無効化する。有効なままだと Redis も必要になる。
  limiter: false
  public_instance: false
  image_proxy: false

search:
  # 【重要】JSON API は既定でオフ。この行が無いと ?format=json が 403 になる。
  formats:
    - html
    - json
  default_lang: "ja"
  # 日本語圏の結果を優先させる。クライアント側でも language=ja を送る。
  autocomplete: ""
  safe_search: 1

outgoing:
  request_timeout: 10.0
  max_request_timeout: 15.0
  pool_connections: 100
  pool_maxsize: 20
  enable_http2: true

engines:
  - name: wikipedia
    language: ja
  - name: bing
    timeout: 5.0
  # 併用するだけだと bing の無関係な1位が上位5件に混ざる。スコアは weight/順位の
  # 和なので、10 にすると yahoo の7位（10/7）も bing の1位（1）より上に来る。
  # bing は yahoo が返さなかった分の補完になり、両方が返した結果は合算で上がる。
  - name: yahoo
    timeout: 5.0
    weight: 10
